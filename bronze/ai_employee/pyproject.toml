[project]
name = "ai-employee-vault"
version = "0.1.0"
description = "Autonomous AI Employee for Obsidian vault automation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "click==8.3.1",
    "coverage>=7.13.4",
    "hatchling>=1.28.0",
    "iniconfig==2.3.0",
    "markdown==3.10.2",
    "markdown-it-py==4.0.0",
    "mdurl==0.1.2",
    "mypy>=1.19.1",
    "packaging==26.0",
    "pluggy==1.6.0",
    "pydantic==2.12.5",
    "pydantic-core==2.41.5",
    "pygments==2.19.2",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "rich==14.3.2",
    "ruff>=0.15.1",
    "shellingham==1.5.4",
    "typer==0.24.0",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "watchdog==6.0.0",
]

[project.scripts]
ai-employee = "src.ai_employee.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
addopts = "-v --tb=short"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_employee"]
