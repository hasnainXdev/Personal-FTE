name: CI

on:
  push:
    branches: [ "001-ai-employee-vault", "main", "master" ]
  pull_request:
    branches: [ "001-ai-employee-vault", "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Install UV
      uses: astral-sh/setup-uv@v3
      with:
        version: "0.9.13"

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        cd ai_employee
        uv sync --all-extras

    - name: Run tests
      run: |
        cd ai_employee
        uv run pytest tests/ -v --tb=short --cov=src --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./ai_employee/coverage.xml
        flags: unittests
        name: codecov-umbrella

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install UV
      uses: astral-sh/setup-uv@v3

    - name: Install dependencies
      run: |
        cd ai_employee
        uv sync --all-extras

    - name: Run type check with mypy
      run: |
        cd ai_employee
        uv run mypy src/ --ignore-missing-imports || true

    - name: Run lint with ruff
      run: |
        cd ai_employee
        uv run ruff check src/ tests/ || true

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install UV
      uses: astral-sh/setup-uv@v3

    - name: Build package
      run: |
        cd ai_employee
        uv build

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: ai_employee/dist/
